name: Build plugin zip

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    name: Build public-lms.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # vendor-prefixed/ (mPDF for certificates) is built, not committed: Strauss
      # needs PHP 8, so the runner is on 8.3 whatever PHP the tests use.
      - name: Build vendor-prefixed
        run: composer prefix

      # composer.json pins the PHP 7.4 platform, so these stay 7.4-compatible.
      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Check that every stylesheet has a mirrored RTL copy
        run: npm run check:rtl
      - run: npm run plugin-zip

      - name: Check the zip has the prefixed mPDF, the built blocks and every RTL stylesheet
        run: |
          unzip -l public-lms.zip > zip.txt
          grep -q 'public-lms/vendor-prefixed/autoload.php' zip.txt
          grep -q 'public-lms/vendor-prefixed/mpdf/mpdf/src/Mpdf.php' zip.txt
          grep -q 'public-lms/assets/fonts/noto/NotoSansArabic-Regular.ttf' zip.txt
          grep -q 'public-lms/build/blocks/' zip.txt
          for css in $(find build assets/css -name '*.css' ! -name '*-rtl.css'); do
            grep -q "public-lms/${css%.css}-rtl.css" zip.txt || { echo "missing ${css%.css}-rtl.css"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: public-lms
          path: public-lms.zip
          if-no-files-found: error

  # Published releases get the zip as an asset, so
  # https://github.com/subedimadhukar/public-lms/releases/latest/download/public-lms.zip
  # (playground.json) always serves the newest release.
  release:
    name: Attach public-lms.zip to the release
    if: github.event_name == 'release'
    needs: zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-lms
      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" public-lms.zip --clobber --repo "${{ github.repository }}"
